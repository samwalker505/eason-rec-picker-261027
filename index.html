<style>
  :root {
    --bg: #E8E8E8;
    --paper: #FFFFFF;
    --ink: #0A0A0A;
    --muted: #5A5A5A;
    --muted-2: #8A8A8A;
    --line: #D0D0D0;
    --line-strong: #0A0A0A;
    --red: #E10600;
    --red-soft: rgba(225, 6, 0, 0.12);
    --panel: #F4F4F4;
    --shadow: 0 1px 0 rgba(0,0,0,0.04), 0 18px 48px rgba(0,0,0,0.10);
    --font: "Helvetica Neue", Helvetica, Inter, "PingFang TC", "Noto Sans TC", Arial, sans-serif;
    --cover-w: 300px;
    --cover-h: 300px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.4;
    min-height: 100vh;
    padding: 12px 8px 20px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: min(96vw, 2260px);
    margin: 0 auto;
    background: var(--paper);
    border: 1px solid #C8C8C8;
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 22px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 0;
    min-height: calc(100vh - 44px);
    overflow: visible;
  }

  .main {
    display: grid;
    grid-template-columns: minmax(280px, 0.65fr) minmax(0, 1.55fr);
    gap: 16px 16px;
    flex: 1;
    min-height: 0;
    padding-bottom: 8px;
    align-items: stretch;
    overflow: visible;
  }
  @media (max-width: 1100px) {
    .main { grid-template-columns: minmax(260px, 0.9fr) minmax(0, 1fr); }
    :root {
      --cover-w: 260px;
      --cover-h: 260px;
    }
  }
  @media (max-width: 920px) {
    .main { grid-template-columns: 1fr; }
    :root {
      --cover-w: 220px;
      --cover-h: 220px;
    }
  }

  .left-col {
    display: flex;
    flex-direction: column;
    min-height: 0;
    padding-right: 4px;
  }
  @media (max-width: 920px) {
    .left-col { padding-right: 0; padding-bottom: 8px; }
  }

  .over-info {
    padding-bottom: 14px;
    margin-bottom: 10px;
  }
  .rec-mark {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .rec-word {
    font-weight: 800;
    font-size: 1.15rem;
    letter-spacing: 0.1em;
  }
  .rec-led {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 3px var(--red-soft);
    animation: rec-breathe 2.4s ease-in-out infinite;
  }
  @keyframes rec-breathe {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 3px var(--red-soft); }
    50% { opacity: 0.35; transform: scale(0.92); box-shadow: 0 0 0 2px rgba(225, 6, 0, 0.06); }
  }
  .over-info h1 {
    margin: 0 0 14px;
    font-size: clamp(1.35rem, 2.6vw, 1.85rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
    margin-bottom: 12px;
  }
  @media (max-width: 520px) {
    .meta-grid { grid-template-columns: 1fr; }
  }
  .meta-item .label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .meta-item .label::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
  }
  .meta-item .value {
    font-size: 0.86rem;
    font-weight: 600;
  }
  .warn-line {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 4px;
  }
  .warn-line::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    flex-shrink: 0;
    margin-top: 0.4em;
  }

  .specific {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .specific-head { margin-bottom: 10px; }
  .specific-date {
    font-size: 1.35rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .specific-date small {
    display: block;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-top: 4px;
  }
  .specific-album {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 4px;
  }
  .specific-meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .specific-meta .note {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--red);
    font-weight: 700;
    margin-left: 6px;
  }
  .specific-meta .note::before {
    content: "";
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
  }
  .specific-foot {
    margin-top: 10px;
    font-size: 0.75rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  /* Right: Swiper Coverflow — wide so L/C/R covers show fully */
  .right-col {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    justify-content: center;
    min-height: 400px;
    position: relative;
    padding: 4px 0;
    overflow: hidden;
    min-width: 0;
  }
  .carousel-shell {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: none;
    min-width: 0;
    overflow: hidden;
  }

  .swiper.swiper-carousel {
    position: relative;
    margin: 0 auto;
    max-width: none;
    /* wide enough for full left + center + right 330px covers */
    width: 100%;
    overflow: hidden;
    padding: 32px 12px 40px;
  }
  .swiper-carousel .swiper-slide {
    width: var(--cover-w);
    height: var(--cover-h);
    border-radius: 6px;
    background: transparent;
    overflow: visible;
  }
  .swiper-carousel .swiper-carousel-animate-opacity {
    width: 100%;
    height: 100%;
  }
  .swiper-carousel .cover-face {
    width: 100%;
    height: 100%;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    background: #222;
    border: 1px solid #222;
    box-shadow: 0 14px 36px rgba(0,0,0,0.22);
  }
  .swiper-carousel img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 6px;
    pointer-events: none;
  }

  /* Match % — plain muted text (no bubble) */
  .swiper-carousel .pct {
    position: absolute;
    top: 9px;
    right: 11px;
    z-index: 5;
    font-size: 0.88rem;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    text-shadow:
      0 0 4px rgba(0,0,0,0.65),
      0 1px 2px rgba(0,0,0,0.55),
      0 0 1px rgba(0,0,0,0.8);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
    pointer-events: none;
    line-height: 1;
  }
  .swiper-carousel .pct.empty {
    color: rgba(255,255,255,0.28);
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    font-weight: 500;
    font-size: 0.78rem;
  }
  .swiper-carousel .pct .pct-unit {
    font-size: 0.66rem;
    font-weight: 500;
    margin-left: 1px;
    opacity: 0.85;
  }

  /* Industrial B&W nav (override Swiper theme blue) */
  .carousel-shell .swiper-button-prev,
  .carousel-shell .swiper-button-next {
    width: 42px;
    height: 42px;
    margin-top: 0;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 50%;
    border: 1.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    --swiper-navigation-size: 14px;
    --swiper-navigation-color: #0A0A0A;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: background 0.15s, color 0.15s;
  }
  .carousel-shell .swiper-button-prev:after,
  .carousel-shell .swiper-button-next:after {
    font-size: 14px;
    font-weight: 800;
  }
  .carousel-shell .swiper-button-prev:hover,
  .carousel-shell .swiper-button-next:hover {
    background: var(--ink);
    color: #fff;
    --swiper-navigation-color: #fff;
  }
  .carousel-shell .swiper-button-prev { left: 8px; }
  .carousel-shell .swiper-button-next { right: 8px; }
  .carousel-shell .swiper-button-disabled {
    opacity: 0.35;
  }

  /* Bottom: search + chips */
  .bottom {
    padding-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .search-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-pill {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #F2F2F2;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 10px 16px;
  }
  .search-pill input {
    flex: 1;
    border: none;
    background: transparent;
    outline: none;
    font: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    min-width: 0;
  }
  .search-pill input::placeholder { color: var(--muted-2); }
  .search-pill .ico {
    width: 18px; height: 18px;
    opacity: 0.55;
    flex-shrink: 0;
  }
  .clear-btn {
    border: 1.5px solid var(--ink);
    background: #fff;
    color: var(--ink);
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    padding: 10px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
  }
  .clear-btn:hover { background: var(--ink); color: #fff; }
  .sel-count {
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .sel-count strong { color: var(--ink); }

  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    max-height: 168px;
    overflow-y: auto;
    padding: 2px 2px 6px;
    -webkit-overflow-scrolling: touch;
  }
  .chip {
    border: 1.5px solid #B8B8B8;
    background: #fff;
    color: var(--ink);
    font-size: 0.78rem;
    font-weight: 600;
    padding: 7px 12px;
    border-radius: 999px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s;
    user-select: none;
  }
  .chip:hover { border-color: var(--ink); }
  .chip.on {
    background: #fff;
    border-color: var(--red);
    color: var(--ink);
  }
  .chip.on::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    margin-right: 6px;
    vertical-align: middle;
  }
  .chip.pulse { animation: chip-pop 0.28s ease; }
  @keyframes chip-pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .chip-divider {
    flex: 0 0 100%;
    width: 100%;
    height: 0;
    border: none;
    border-top: 1px solid var(--line);
    margin: 6px 0 4px;
    padding: 0;
    pointer-events: none;
  }
  .chips-empty {
    font-size: 0.82rem;
    color: var(--muted);
    padding: 8px 0;
  }
  .best-row {
    margin-top: 4px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px 16px;
    min-height: 28px;
  }
  .best-match {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 14px;
    flex: 1;
    min-width: 0;
  }
  .best-match .bm-label {
    font-size: 0.62rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--red);
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .best-match .bm-empty {
    font-size: 0.78rem;
    color: var(--muted-2);
    font-weight: 500;
  }
  .best-match .bm-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: baseline;
  }
  .best-match .bm-link {
    border: none;
    background: none;
    padding: 0;
    margin: 0;
    font: inherit;
    cursor: pointer;
    text-align: left;
    color: var(--ink);
    display: inline-flex;
    align-items: baseline;
    gap: 8px;
    max-width: 100%;
  }
  .best-match .bm-link:hover .bm-album {
    color: var(--red);
  }
  .best-match .bm-album {
    font-size: 0.88rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1.5px;
    transition: color 0.12s;
  }
  .best-match .bm-meta {
    font-size: 0.72rem;
    font-weight: 600;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .best-match .bm-pct {
    font-size: 0.78rem;
    font-weight: 800;
    color: var(--red);
    font-variant-numeric: tabular-nums;
  }

  .credit {
    margin-left: auto;
    flex-shrink: 0;
  }
  .credit a {
    font-size: 0.52rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-2);
    text-decoration: none;
    white-space: nowrap;
  }
  .credit a:hover { color: var(--red); }
</style>

const WD_EN = { "一":"MON","二":"TUE","三":"WED","四":"THU","五":"FRI","六":"SAT","日":"SUN" };
const STORE_KEY = "eason-rec-picker-v2";

function coverSrc(key) {
  if (!key) return "";
  if (key === "ihadagreattime") return "covers/ihadagreattime.svg";
  return `covers/${key}.jpg`;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatDate(iso) {
  const [y, m, d] = iso.split("-");
  return `${y}.${m}.${d}`;
}

const selected = new Set();
let activeIndex = 0;
let searchQ = "";
let discSwiper = null;
let syncingFromSwiper = false;

function loadState() {
  try {
    const raw = sessionStorage.getItem(STORE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.selected)) data.selected.forEach(s => selected.add(s));
    if (typeof data.activeIndex === "number" && data.activeIndex >= 0 && data.activeIndex < SHOWS.length) {
      activeIndex = data.activeIndex;
    }
  } catch (_) {}
}
function saveState() {
  try {
    sessionStorage.setItem(STORE_KEY, JSON.stringify({
      selected: [...selected],
      activeIndex
    }));
  } catch (_) {}
}

function allUniqueSongs() {
  const map = new Map();
  SHOWS.forEach(show => {
    show.songs.forEach(s => {
      if (!map.has(s)) map.set(s, []);
      map.get(s).push(show.id);
    });
  });
  return [...map.keys()].sort((a, b) => a.localeCompare(b, "zh-Hant"));
}
const CATALOG = allUniqueSongs();

function matchStats(show) {
  const total = selected.size;
  if (!total) return { count: 0, pct: 0, empty: true };
  let count = 0;
  const set = new Set(show.songs);
  selected.forEach(s => { if (set.has(s)) count++; });
  return { count, pct: Math.round(100 * count / total), empty: false };
}

function bestMatches() {
  if (!selected.size) return { empty: true, items: [] };
  const ranked = SHOWS.map((show, i) => {
    const st = matchStats(show);
    return { i, show, pct: st.pct, count: st.count };
  }).sort((a, b) => b.pct - a.pct || a.i - b.i);
  const top = ranked[0].pct;
  const items = ranked.filter(r => r.pct === top).slice(0, 3);
  return { empty: false, items, pct: top };
}

function goToShow(index) {
  if (index < 0 || index >= SHOWS.length) return;
  if (discSwiper) {
    if (typeof discSwiper.slideToLoop === "function") {
      discSwiper.slideToLoop(index, 600);
    } else {
      discSwiper.slideTo(index, 600);
    }
  } else {
    activeIndex = index;
    saveState();
    renderSpecific();
    renderChips();
    renderBestMatch();
  }
}

function renderBestMatch() {
  const el = document.getElementById("bestMatch");
  if (!el) return;
  const { empty, items, pct } = bestMatches();
  if (empty) {
    el.innerHTML = `<span class="bm-label">目前最高 match</span><span class="bm-empty">未揀歌</span>`;
    return;
  }
  const links = items.map(({ i, show, count }) => {
    return `<button type="button" class="bm-link" data-i="${i}" title="轉去呢隻碟">
      <span class="bm-album">${escapeHtml(show.label)}</span>
      <span class="bm-meta">${formatDate(show.dateISO)} · ${count}/${selected.size}</span>
      <span class="bm-pct">${pct}%</span>
    </button>`;
  }).join("");
  el.innerHTML = `<span class="bm-label">目前最高 match</span><div class="bm-links">${links}</div>`;
  el.querySelectorAll(".bm-link").forEach(btn => {
    btn.addEventListener("click", () => goToShow(+btn.dataset.i));
  });
}


function renderSpecific() {
  const show = SHOWS[activeIndex];
  const st = matchStats(show);
  const note = show.note ? `<span class="note">${escapeHtml(show.note)}</span>` : "";

  document.getElementById("specific").innerHTML = `
    <div class="specific-head">
      <div class="specific-date">
        ${formatDate(show.dateISO)}
        <small>${WD_EN[show.weekdayZh] || ""} · 星期${escapeHtml(show.weekdayZh)}</small>
      </div>
    </div>
    <h2 class="specific-album">${escapeHtml(show.label)}</h2>
    <div class="specific-meta">${show.year} · ${show.songs.length} 首${note}</div>
    <div class="specific-foot">${st.empty ? "未揀歌 — 下面 chip 撳住揀" : `命中 ${st.count} / ${selected.size} 首已揀（${st.pct}%）`}</div>
  `;
}

function pctHtml(show) {
  const st = matchStats(show);
  if (st.empty) return `<span class="pct empty">—</span>`;
  return `<span class="pct">${st.pct}<span class="pct-unit">%</span></span>`;
}

function updateAllPct() {
  document.querySelectorAll("#swiperWrapper .swiper-slide").forEach(slide => {
    const i = +slide.dataset.i;
    const wrap = slide.querySelector(".cover-face");
    if (!wrap) return;
    let pctEl = wrap.querySelector(".pct");
    if (!pctEl) {
      wrap.insertAdjacentHTML("beforeend", pctHtml(SHOWS[i]));
      return;
    }
    const st = matchStats(SHOWS[i]);
    if (st.empty) {
      pctEl.className = "pct empty";
      pctEl.textContent = "—";
    } else {
      pctEl.className = "pct";
      pctEl.innerHTML = `${st.pct}<span class="pct-unit">%</span>`;
    }
  });
}

function buildSlides() {
  const wrap = document.getElementById("swiperWrapper");
  wrap.innerHTML = SHOWS.map((show, i) => {
    const src = coverSrc(show.coverKey);
    return `<div class="swiper-slide" data-i="${i}" role="group" aria-label="${escapeHtml(show.label)}">
      <div class="swiper-carousel-animate-opacity">
        <div class="cover-face">
          <img src="${src}" alt="${escapeHtml(show.label)}" loading="lazy" />
          ${pctHtml(show)}
        </div>
      </div>
    </div>`;
  }).join("");
}

function initSwiper() {
  buildSlides();
  discSwiper = new Swiper("#discSwiper", {
    effect: "coverflow",
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: "auto",
    loop: true,
    loopAdditionalSlides: 3,
    initialSlide: activeIndex,
    speed: 600,
    coverflowEffect: {
      rotate: 38,
      stretch: 24,
      depth: 100,
      modifier: 1,
      slideShadows: true
    },
    navigation: {
      nextEl: ".carousel-shell .swiper-button-next",
      prevEl: ".carousel-shell .swiper-button-prev"
    },
    keyboard: {
      enabled: true,
      onlyInViewport: true
    },
    on: {
      slideChange(sw) {
        const ri = sw.realIndex;
        if (ri === activeIndex) return;
        syncingFromSwiper = true;
        activeIndex = ri;
        saveState();
        renderSpecific();
        renderChips();
        renderBestMatch();
        syncingFromSwiper = false;
      }
    }
  });
}

function chipHtml(s, pulseSong) {
  const on = selected.has(s);
  const pulse = pulseSong === s ? " pulse" : "";
  return `<button type="button" class="chip${on ? " on" : ""}${pulse}" data-song="${escapeHtml(s)}" role="option" aria-selected="${on}">${escapeHtml(s)}</button>`;
}

function orderedChipSongs() {
  const q = searchQ.trim().toLowerCase();
  const matchQ = (s) => !q || s.toLowerCase().includes(q);
  const activeSongs = SHOWS[activeIndex].songs.filter(matchQ);
  const activeSet = new Set(activeSongs);
  const rest = CATALOG.filter(s => matchQ(s) && !activeSet.has(s));
  return { activeSongs, rest };
}

function renderChips(pulseSong) {
  const { activeSongs, rest } = orderedChipSongs();
  const box = document.getElementById("chips");

  if (!activeSongs.length && !rest.length) {
    box.innerHTML = `<div class="chips-empty">搵唔到「${escapeHtml(searchQ)}」</div>`;
  } else {
    const parts = [];
    activeSongs.forEach(s => parts.push(chipHtml(s, pulseSong)));
    if (activeSongs.length && rest.length) {
      parts.push(`<hr class="chip-divider" aria-hidden="true" />`);
    }
    rest.forEach(s => parts.push(chipHtml(s, pulseSong)));
    box.innerHTML = parts.join("");
    box.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => toggleSong(btn.dataset.song));
    });
  }
  document.getElementById("selCount").innerHTML = `已揀 <strong>${selected.size}</strong>`;
}

function toggleSong(song) {
  if (selected.has(song)) selected.delete(song);
  else selected.add(song);
  saveState();
  renderChips(song);
  updateAllPct();
  renderSpecific();
  renderBestMatch();
}

function clearAll() {
  selected.clear();
  saveState();
  renderChips();
  updateAllPct();
  renderSpecific();
  renderBestMatch();
}

document.getElementById("clearBtn").addEventListener("click", clearAll);
document.getElementById("search").addEventListener("input", e => {
  searchQ = e.target.value;
  renderChips();
});

loadState();
initSwiper();
renderSpecific();
renderChips();
renderBestMatch();
</script>
